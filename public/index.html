<script>
	document.addEventListener('click', (e) => {
		const toggle = e.target.closest('[data-sidebar-toggle]');
		if (!toggle) return;

		e.preventDefault();
		e.stopPropagation();

		const expanded = toggle.getAttribute('aria-expanded') === 'true';
		toggle.setAttribute('aria-expanded', String(!expanded));

		const submenu = document.getElementById(toggle.getAttribute('aria-controls'));
		if (submenu) submenu.classList.toggle('is-open', !expanded);
	});
</script>

    <script>
	function setProgress(percent) {
		const value = document.querySelector('.progress-value');
		const number = document.querySelector('.progress-number');

		const length = value.getTotalLength();

		value.style.strokeDasharray = length;
		value.style.strokeDashoffset = length * (1 - percent / 100);

		number.textContent = `${percent}%`;
	}
	setProgress(84);

<script>
	document.querySelectorAll('.widget-dropdown-wrap').forEach((dropdown) => {
		const button = dropdown.querySelector('.widget-dropdown-button');
		const items = dropdown.querySelectorAll('.widget-dropdown li button');

		button.addEventListener('click', (e) => {
			e.stopPropagation();
			dropdown.classList.toggle('is-active');
		});

		items.forEach((item) => {
			item.addEventListener('click', () => {
				const value = item.textContent.trim();

				const outerSpan = button.querySelector('span');
				const innerSpan = outerSpan ? outerSpan.querySelector('span') : null;

				if (innerSpan) {
					innerSpan.textContent = value;
				} else if (outerSpan) {
					outerSpan.textContent = value;
				}
				dropdown.classList.remove('is-active');
			});
		});
	});

	document.addEventListener('click', () => {
		document.querySelectorAll('.widget-dropdown-wrap.is-active')
			.forEach((el) => el.classList.remove('is-active'));
	});
</script>    </body>
